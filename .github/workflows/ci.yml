name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_PASSWORD: secret
          MYSQL_USER: laravel
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, zip, intl, opcache, redis
          coverage: xdebug
          tools: composer:v2

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Execute tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: secret
        run: php artisan test --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, zip, intl, opcache
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check for code quality tools
        id: check-tools
        run: |
          echo "Checking for code quality tools..."

          MISSING_TOOLS=""

          if [ ! -f vendor/bin/phpstan ]; then
            MISSING_TOOLS="${MISSING_TOOLS}PHPStan "
          fi

          if [ ! -f vendor/bin/php-cs-fixer ]; then
            MISSING_TOOLS="${MISSING_TOOLS}PHP-CS-Fixer "
          fi

          if [ ! -f vendor/bin/phpcs ]; then
            MISSING_TOOLS="${MISSING_TOOLS}PHPCS "
          fi

          if [ -n "$MISSING_TOOLS" ]; then
            echo "⚠️ Warning: The following tools are not installed:"
            echo "$MISSING_TOOLS"
            echo ""
            echo "To install development tools, run:"
            echo "  make install-dev-tools"
            echo ""
            echo "Or manually:"
            echo "  composer require --dev friendsofphp/php-cs-fixer phpstan/phpstan larastan/larastan squizlabs/php_codesniffer"
            echo ""
            echo "These tools will be skipped in this CI run."
          else
            echo "✅ All code quality tools are installed"
          fi

      - name: Run PHPStan
        continue-on-error: true
        run: |
          if [ -f vendor/bin/phpstan ]; then
            echo "Running PHPStan..."
            vendor/bin/phpstan analyse
          else
            echo "⏭️ Skipping PHPStan (not installed)"
            exit 0
          fi

      - name: Run PHP CS Fixer (dry-run)
        continue-on-error: true
        run: |
          if [ -f vendor/bin/php-cs-fixer ]; then
            echo "Running PHP-CS-Fixer..."
            vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "⏭️ Skipping PHP-CS-Fixer (not installed)"
            exit 0
          fi

      - name: Run PHPCS
        continue-on-error: true
        run: |
          if [ -f vendor/bin/phpcs ]; then
            echo "Running PHPCS..."
            vendor/bin/phpcs
          else
            echo "⏭️ Skipping PHPCS (not installed)"
            exit 0
          fi

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Security check (Composer audit)
        run: composer audit

  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ Warning: package-lock.json not found"
            echo ""
            echo "For faster CI/CD builds and reproducible dependencies,"
            echo "please generate and commit package-lock.json:"
            echo ""
            echo "  docker compose exec app npm install"
            echo "  git add package-lock.json"
            echo "  git commit -m 'chore: add package-lock.json'"
            echo ""
            echo "Continuing with 'npm install'..."
          else
            echo "✅ package-lock.json found"
          fi

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: public/build/
          retention-days: 7
